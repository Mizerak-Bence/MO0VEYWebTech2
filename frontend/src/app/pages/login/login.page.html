<div class="page">
  <div
    class="login-stack"
    [style.--pointer-x.%]="pointerX()"
    [style.--pointer-y.%]="pointerY()"
    (pointermove)="onPointerMove($event)"
    (pointerleave)="resetPointer()"
  >
    <div class="stage-window" aria-hidden="true">
      <canvas #backdropCanvas class="stage-canvas"></canvas>
      <div class="stage-noise"></div>
      <div class="stage-sheen"></div>
    </div>

    <mat-card class="login-card">
      <mat-card-content>
        <div class="card-header">
          <div class="card-kicker">Pálinka nyilvántartó</div>
          <h1 class="card-title">Bejelentkezés</h1>
          <p class="card-subtitle">Belépés az admin és felhasználói felületre.</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="form">
          <mat-form-field appearance="outline">
            <mat-label>Felhasználónév</mat-label>
            <input matInput formControlName="username" autocomplete="username" />
            <mat-error *ngIf="form.controls.username.touched && form.controls.username.invalid">
              A felhasználónév legalább 3 karakter.
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Jelszó</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="current-password" />
            <mat-error *ngIf="form.controls.password.touched && form.controls.password.invalid">
              A jelszó kötelező.
            </mat-error>
          </mat-form-field>

          <div class="error" *ngIf="error()">{{ error() }}</div>

          <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
            Bejelentkezés
          </button>

          <a routerLink="/register" class="link">Nincs még fiókod? Regisztráció</a>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
